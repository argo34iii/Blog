# 管理画面でタイトルを空欄のまま保存した記事に「日記　YYYYMMDD」を書き込む
name: タイトル自動入力

on:
  push:
    branches: [main]
    paths: ['src/content/blog/**']

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 空のタイトルを埋める
        run: node scripts/fill-titles.mjs
      - name: 変更があればコミット
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "タイトルを自動入力"
          git push
