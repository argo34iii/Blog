backend:
  name: github
  repo: argo34iii/Blog
  branch: main

# 画像の置き場所（アップロード時にWebPへ変換・縮小）
media_folder: public/images
public_folder: /images
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

collections:
  - name: blog
    label: ブログ
    label_singular: 記事
    folder: src/content/blog
    create: true
    # URLは投稿日時から自動で付ける（例: /blog/20261104-2230/）
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}"
    sortable_fields: [date, title]
    # 管理画面の記事一覧での表示（タイトルが空でも日付で見分けられるように）
    summary: "{{date}}　{{title}}"
    fields:
      # 空欄のままなら、サイト側で「日記　YYYYMMDD」（日付欄の日付）になる
      - { name: title, label: タイトル（空欄で「日記　日付」）, widget: string, required: false }
      - { name: date, label: 日付, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      # 複数選択できるプルダウン。カテゴリーを増やすときは options に足す
      - name: category
        label: カテゴリー
        widget: select
        multiple: true
        options: [雑記, お知らせ, 本の感想]
        default: [雑記]
      # 本の感想を書くときだけ使う。書名を入れた記事が本棚ページ（/blog/books/）に並ぶ
      - name: book
        label: 本の情報（本の感想のときだけ）
        widget: object
        required: false
        fields:
          - { name: title, label: 書名, widget: string, required: false }
          - { name: author, label: 著者, widget: string, required: false }
          - { name: rating, label: 評価（1〜5）, widget: select, required: false, options: [1, 2, 3, 4, 5] }
          - name: cover
            label: 表紙画像
            widget: image
            required: false
            media_folder: /public/images/{{year}}{{month}}{{day}}
            public_folder: /images/{{year}}{{month}}{{day}}
      # 本文ツールバーの画像ボタン（photo.js）で追加した画像。記事の日付のフォルダに保存される
      - name: uploads
        label: 画像
        widget: photo-uploads
        required: false
        media_folder: /public/images/{{year}}{{month}}{{day}}
        public_folder: /images/{{year}}{{month}}{{day}}
      # raw（テキスト入力）を先頭にして、改行・空行を書いたとおりに保存する
      - name: body
        label: 本文
        widget: markdown
        modes: [raw, rich_text]
        # 新規作成時に本文へ入るテンプレート
        default: |+
          日記。

          朝飯: 
          昼飯: 
          夜飯: 

          退勤時間: 

  # サイト全体の設定（1つのファイルを編集する）
  - name: settings
    label: サイト設定
    files:
      - name: home
        label: ホームページ
        file: src/data/home.json
        fields:
          - { name: title, label: タイトル（見出しとブラウザのタブに表示）, widget: string }
      - name: blog
        label: ブログ
        file: src/data/blog.json
        fields:
          - { name: title, label: ブログ名, widget: string }
          - name: headerImage
            label: ヘッダー画像（横長。空欄ならブログ名の文字だけ）
            widget: image
            required: false
            media_folder: /public/images/header
            public_folder: /images/header
          - { name: showTitleOnHeader, label: 画像の上にブログ名を表示する, widget: boolean, default: true }
      - name: profile
        label: プロフィール
        file: src/data/profile.json
        fields:
          - name: icon
            label: アイコン画像
            widget: image
            required: false
            media_folder: /public/images/profile
            public_folder: /images/profile
          - { name: name, label: 名前, widget: string }
          - { name: role, label: 肩書き, widget: string, required: false }
          - { name: bio, label: 自己紹介（任意）, widget: text, required: false }
